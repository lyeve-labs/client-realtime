name: release

# Publishes the package to npm when a vX.Y.Z tag is pushed.
#
# The two guards below are the reason this file exists. Four releases across this
# estate were tagged with package.json left on the previous version, so the tag
# named a version that never reached the registry while consumers kept resolving
# the old one. Nothing failed and nothing warned. A mismatched tag now fails here
# instead.
#
# Auth works in either of two modes, with no change to this file:
#
#   Trusted publishing, preferred. Configure the package on npmjs.com to trust
#   this repository and this workflow filename. No secret is stored anywhere, and
#   npm attaches a provenance attestation. Requires a public repository.
#
#   NPM_TOKEN secret, fallback. Set it in repository settings. Use this while the
#   repository is still private.
#
# Provenance is requested only when the repository is public, because npm rejects
# the flag otherwise.

on:
  push:
    tags: ['v*.*.*']
  # Re-run for a tag that already exists, for when a tag push lands during an
  # Actions outage and never triggers a run.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json ${pkg}. Bump the version in the release commit, then retag."
            exit 1
          fi
          echo "publishing version ${pkg}"

      - name: Version must not already exist
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          # --prefer-online because npm answers from a stale local packument
          # otherwise, which reports the previous version as latest.
          if npm view --prefer-online "${name}@${ver}" version >/dev/null 2>&1; then
            echo "::error::${name}@${ver} is already on the registry. Registry versions are immutable, so bump the version rather than retagging."
            exit 1
          fi

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          args=""
          if [ "$IS_PRIVATE" = "false" ]; then
            args="--provenance"
            echo "public repository, requesting a provenance attestation"
          else
            echo "private repository, publishing without provenance"
          fi
          npm publish $args

      - name: Confirm the registry serves it
        run: |
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          encoded="${name/\//%2F}"
          latest="$(curl -sf "https://registry.npmjs.org/${encoded}" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'].latest")"
          if [ "$latest" != "$ver" ]; then
            echo "::error::published ${ver} but the registry serves ${latest} as latest."
            exit 1
          fi
          echo "registry serves ${name}@${latest}"
